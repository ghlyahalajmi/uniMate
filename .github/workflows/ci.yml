name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run, so a busy afternoon
# does not queue up six builds of code nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Deliberately dummy. The build only needs these to be present and
    # well-formed, so a contributor's pull request is validated without any
    # secret being exposed to it.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:calc

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

  responsive:
    name: Responsive and target-size checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start the app
        run: |
          PORT=3100 npm start &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3100/api/health > /dev/null; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "the app did not start within 60s"; exit 1

      # Fails on horizontal overflow, text under 12px, or any interactive
      # target under 32px tall — in English and Arabic. These rules have
      # caught real regressions, so they gate the merge rather than advise.
      - name: Check every viewport
        run: BASE=http://localhost:3100 npm run check:responsive
